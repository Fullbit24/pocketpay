<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="PocketPay mark">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#C9D1D8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A900"/>
      <stop offset="1" stop-color="#C98900"/>
    </linearGradient>
  </defs>

  <!-- shield body -->
  <path d="M48 4 L88 18 V50 C88 71 70 86 48 92 C26 86 8 71 8 50 V18 Z"
        fill="url(#steel)" stroke="#8E99A5" stroke-width="3" stroke-linejoin="round"/>

  <!-- inner highlight -->
  <path d="M48 12 L81 23 V50 C81 67 66 80 48 85 C30 80 15 67 15 50 V23 Z"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>

  <!-- wallet slot -->
  <rect x="27" y="44" width="42" height="26" rx="5"
        fill="#2F3A45" stroke="#8E99A5" stroke-width="2"/>

  <!-- card peeking out -->
  <rect x="33" y="36" width="30" height="12" rx="3"
        fill="url(#amber)" stroke="#C98900" stroke-width="1.5"/>

  <!-- clasp -->
  <circle cx="60" cy="57" r="4.5" fill="url(#amber)" stroke="#C98900" stroke-width="1.5"/>
</svg>
