# policy.yaml - VENATOR decision policy.
#
# EVERY number and toggles the guard reads lives in this file. No threshold is
# hard-coded anywhere in Python. Change a value here, restart, and the system
# behaves differently - which is what "do not hard-code it" means.
#
# The guard rule order is defined in `rules:` at the bottom. Each entry is a
# module in `venator/rules/`. Remove one to switch it off; the system still runs.

version: 3
currency: AED

# ---------------------------------------------------------------------------
# Roles and permissions
# ---------------------------------------------------------------------------
# WHO may do WHAT is declared here, not in Python. Code knows how to check a
# permission name; which role holds which permission comes from this section and
# is read at request time. Adding a role, or moving a permission between roles,
# is an edit to this file - no code change.
#
# The permission names below are the full set the API understands. A role with
# an empty list may authenticate and see itself, but can change nothing.
#
#   view_queue       read the transaction queue and individual transactions
#   triage           run the agent chain on a transaction
#   resolve_own      resolve a transaction that belongs to this user
#   resolve_any      resolve any transaction (staff review)
#   guardian_approve approve or decline a minor's guardian-gated transfer
#   change_policy    change a policy value through PATCH /api/v1/policy
#   view_audit       read the audit log
#   view_users       list and read user records
roles:
  student:
    - view_queue
    - triage
    - resolve_own
  guardian:
    - view_queue
    - guardian_approve
    - resolve_own
  staff:
    - view_queue
    - triage
    - resolve_any
    - view_audit
  admin:
    - view_queue
    - triage
    - resolve_any
    - guardian_approve
    - change_policy
    - view_audit
    - view_users

# ---------------------------------------------------------------------------
# Amounts
# ---------------------------------------------------------------------------
amounts:
  # A single transfer at or below this can auto-clear when everything else is calm.
  auto_clear_limit: 300
  # Uncertain (mid-risk, unverified) transfers above this go to staff.
  uncertain_escalate_above: 150
  # Above this, a human always confirms - no rule may auto-clear it.
  human_confirm_always_above: 250

# ---------------------------------------------------------------------------
# Risk
# ---------------------------------------------------------------------------
risk:
  # At or above this the transfer escalates on risk alone.
  high: 70
  # The "uncertain middle" - escalate when combined with an unverified recipient.
  mid_low: 30
  # Model confidence below this means we ask a human instead of acting on it.
  min_confidence: 0.5

# ---------------------------------------------------------------------------
# HS-1.1  Split-payment scam
# ---------------------------------------------------------------------------
split_payment:
  enabled: true
  # Rolling window for a sender -> recipient pair.
  window_minutes: 60
  # If the rolling total for the pair reaches this, the next transfer holds.
  trigger_total: 200
  # Transfers of at least this size count toward the rolling total. Smaller
  # canteen-style payments are ignored so normal small spending is not punished.
  min_counted_amount: 24

# ---------------------------------------------------------------------------
# HS-1.2  Lookalike vendor
# ---------------------------------------------------------------------------
lookalike:
  enabled: true
  # A normalised name this similar (but not identical) to a verified vendor
  # is treated as high risk. 1.0 = identical.
  similarity_threshold: 0.87
  # Normalisation rewrites these before comparing.
  digit_swaps:
    "0": "o"
    "1": "l"
    "3": "e"
    "5": "s"

# ---------------------------------------------------------------------------
# HS-1.3  Prompt injection from message text
# ---------------------------------------------------------------------------
injection:
  enabled: true
  # Instruction-like phrases. Message text is DATA - it can flag a transfer,
  # it can never clear one. Any hit is escalated and the text is redacted
  # before the model sees it.
  patterns:
    - "system:"
    - "assistant:"
    - "note for the"
    - "note to the"
    - "ignore your rules"
    - "ignore previous"
    - "disregard"
    - "pre-approved"
    - "preapproved"
    - "mark the payment safe"
    - "mark it safe"
    - "clear it now"
    - "this seller is verified"
    - "you are allowed to"
    - "override"

# ---------------------------------------------------------------------------
# HS-1.4  Cancel window after a student confirms
# ---------------------------------------------------------------------------
cancel_window:
  enabled: true
  # Seconds a student has to take back a confirmation.
  seconds: 120

# ---------------------------------------------------------------------------
# HS-1.5  Guardian approval for younger students
# ---------------------------------------------------------------------------
guardian:
  enabled: true
  # Students strictly under this age need a guardian for peer transfers.
  minor_age_below: 16
  # ...but only above this amount. Small transfers are unaffected.
  requires_approval_above: 100
  # Roles counted as peer transfers (as opposed to vendors).
  peer_tiers:
    - trusted_peer
    - unverified

# ---------------------------------------------------------------------------
# Recipient trust
# ---------------------------------------------------------------------------
recipients:
  trusted_tiers:
    - verified_vendor
    - trusted_peer
  # At or above this many confirmed reports the recipient escalates outright.
  scam_reports_escalate_at: 2

# ---------------------------------------------------------------------------
# User interface defaults
# ---------------------------------------------------------------------------
# The defaults a person's account starts from, and the ONLY declaration of which
# preferences exist and what each may be set to. venator/prefs.py reads this
# section at call time: a key that is not named here cannot be stored, and a
# value outside the allowed set is rejected with a message. Add a key here to
# make it settable; there is no hard-coded key list in Python.
#
# Each entry:
#   default    the value a new account starts with
#   options    the closed set of allowed values (a select / radio group)
#   type       "enum" (options), "bool" (default true/false), or "text"
#   label      the human label the settings surface renders
#   group      the grouped section the surface files it under
#   applies    "behaviour" when the value changes what the app does, or
#              "display" when it is stored but not yet wired to an effect.
ui:
  # --- Appearance ---------------------------------------------------------
  theme:
    type: enum
    default: system
    options: [light, dark, system]
    label: "Theme"
    group: "Appearance"
    applies: behaviour
  density:
    type: enum
    default: comfortable
    options: [comfortable, compact]
    label: "Density"
    group: "Appearance"
    applies: behaviour
  reduced_motion:
    type: enum
    # "system" follows the operating system; "on"/"off" are an explicit override
    # that wins over the OS setting.
    default: system
    options: [system, on, off]
    label: "Motion"
    group: "Appearance"
    applies: behaviour
  larger_text:
    type: bool
    default: false
    label: "Larger text"
    group: "Accessibility"
    applies: behaviour

  # --- Notifications ------------------------------------------------------
  alert_sound:
    type: bool
    default: true
    label: "Alert sound on escalation"
    group: "Notifications"
    applies: behaviour
  escalation_banner:
    type: bool
    default: true
    label: "Show escalation banner"
    group: "Notifications"
    applies: behaviour

  # --- Operations (queue behaviour) --------------------------------------
  default_queue_filter:
    type: enum
    default: needs_review
    options: [all, needs_review, escalated, cleared]
    label: "Default queue filter"
    group: "Payments"
    applies: behaviour
  show_resolved:
    type: bool
    default: true
    label: "Show resolved items"
    group: "Payments"
    applies: behaviour
  confirm_verbosity:
    type: enum
    default: standard
    options: [brief, standard, detailed]
    label: "Confirmation dialogs"
    group: "Payments"
    applies: behaviour

  # --- Privacy ------------------------------------------------------------
  analytics_opt_out:
    type: bool
    default: false
    label: "Usage analytics"
    group: "Privacy"
    applies: display
  retain_history_days:
    type: enum
    default: "90"
    options: ["30", "90", "365"]
    label: "Keep activity history"
    group: "Privacy"
    applies: display

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # Directory lookup timeout, seconds. On timeout the transfer HOLDS, never blocks.
  directory_timeout_seconds: 4.0

# ---------------------------------------------------------------------------
# Intel — the campus intelligence layer (venator/intel.py).
# ---------------------------------------------------------------------------
# These thresholds drive the HISTORY analyses, not the per-payment guard. They
# are read at call time by venator/intel.py; nothing here decides a single
# payment, and nothing here moves money. See CAMPUS_INTEL.md.
intel:
  # Width, in minutes, of the rolling window a history analysis looks back over
  # when its caller does not pass an explicit window. 1440 = 24 hours.
  default_window_minutes: 1440
  # Velocity: only transfers of at least this many AED count toward a pair's
  # ranking, so canteen-size spending does not dominate the list.
  velocity_min_amount: 24
  # A recipient paid by at least this many DISTINCT senders inside a window is
  # treated as a coordination candidate.
  recipient_min_distinct_senders: 2
  # A recipient account at or below this age (days) is treated as "new".
  recipient_new_days: 30
  # Report a campaign only when it links at least this many escalations.
  campaign_min_size: 2
  # Anomaly: a transfer at least this multiple of the student's own average
  # transfer is reported as diverging from their baseline.
  anomaly_multiplier: 3.0
  # Anomaly: score weight given to a payment to a recipient the student has
  # never paid before, on the same scale as the amount ratio.
  anomaly_new_recipient_weight: 3.0

# ---------------------------------------------------------------------------
# Rule order - first match wins. Names map to venator/rules/*.py
# ---------------------------------------------------------------------------
rules:
  - known_scam_link        # R1
  - repeat_offender        # R1b
  - injection_attempt      # R1d
  - lookalike_vendor       # R1e
  - analysis_missing       # R2
  - low_confidence         # R2b
  - missing_risk           # R2c
  - split_payment          # R1f
  - unverified_high_risk   # R1c
  - directory_outage       # R3
  - high_risk              # R4
  - uncertain_value        # R5
  - guardian_required      # R6
  - trusted_small          # R7
  - default_hold           # R8
